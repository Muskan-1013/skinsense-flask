{% extends "base.html" %}
{% block title %}Account | SkinSense{% endblock %}
{% block content %}
<section class="form-section">
    <p class="script">Your profile</p>
    <h1>Welcome, {{ user }}.</h1>
    <p>You are logged in to SkinSense.</p>

    <p class="form-alt"><a href="/my-skin">My Skin</a> · <a href="/pair">Pair a device</a></p>

    <form method="POST" action="/logout">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="btn" type="submit">Log Out</button>
    </form>
</section>
{% endblock %}
