{% extends "base.html" %}
{% block content %}
<section class="form-section">
    <p class="script">Join us</p>
    <h1>Create your account.</h1>
    <p>Join the SkinSense community.</p>

    <form method="POST">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" required>

        <label for="password">Password</label>
        <input id="password" type="password" name="password" required minlength="{{ min_length }}">

        <button class="btn" type="submit">Create Account</button>
    </form>

    {% if message %}
    <p class="msg msg-err">{{ message }}</p>
    {% endif %}

    <p class="form-alt">
        Already have an account? <a href="/login">Log in</a>
    </p>
</section>
{% endblock %}
